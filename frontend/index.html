<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneDialysis</title>
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="/images/logo-light.svg" />
    <meta name="theme-color" content="#F6F4EE" />
    <script>
      (() => {
        let theme = 'light';
        try {
          const stored = localStorage.getItem('dialysis-colour-theme');
          if (stored === 'dark') theme = 'dark';
        } catch {}
        document.documentElement.dataset.theme = theme;
        const favicon = document.getElementById('app-favicon');
        favicon.href = theme === 'dark' ? '/images/logo-dark.svg' : '/images/logo-light.svg';
        favicon.type = 'image/svg+xml';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#1C1A18' : '#F6F4EE');
      })();
    </script>
    <style>
      html { background: #F6F4EE; color: #292721; color-scheme: light; }
      html[data-theme=dark] { background: #1C1A18; color: #F4F0E7; color-scheme: dark; }
      body { margin: 0; min-height: 100svh; isolation: isolate; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
